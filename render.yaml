# ==============================================================================
# VAYU FastAPI Backend — Render Blueprint Specification
# Blueprint documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: vayu-backend
    env: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    # Render instance tiers: starter=512MB, standard=2GB. Standard provides the required >= 1GB RAM headroom.
    plan: standard
    region: singapore
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: RELOAD
        value: false
      - key: VAYU_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://portal.vayusat.live,https://www.vayusat.live,https://vayusat.live
      - key: FIREBASE_PROJECT_ID
        value: vayusat-live
      - key: DB_POOL_MIN_SIZE
        value: "1"
      - key: DB_POOL_MAX_SIZE
        value: "3"
      # Set these in the Render Dashboard Secret Environment Variables (never commit plaintext):
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_KEY
        sync: false
      - key: WINDY_API_KEY
        sync: false
