<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/vayu-icon.png" />
    <link rel="apple-touch-icon" href="/vayu-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>VAYU — India Cyclone & Weather Intelligence</title>
    <script>
      // Self-healing recovery from stale deployment chunk mismatch
      window.addEventListener('error', function(event) {
        var el = event.target;
        if (el && el.tagName === 'LINK' && el.rel === 'stylesheet') {
          console.warn('[VAYU] Primary stylesheet failed to load, activating fallback...', el.href);
          var fallback = document.getElementById('vayu-fallback-style');
          if (!fallback) {
            var link = document.createElement('link');
            link.id = 'vayu-fallback-style';
            link.rel = 'stylesheet';
            link.href = '/assets/style.css?t=' + Date.now();
            document.head.appendChild(link);
          }
          var reloadKey = 'vayu_css_reload_' + (el.href || '').split('/').pop().split('?')[0];
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            setTimeout(function() { window.location.reload(true); }, 500);
          }
        }
      }, true);
    </script>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
          var savedFont = localStorage.getItem('vayu_font_offset');
          if (savedFont !== null) {
            var map = { '-3': 75, '-2': 85, '-1': 92, '0': 100, '1': 110, '2': 125, '3': 140, '4': 155 };
            var pct = map[savedFont] || 100;
            document.documentElement.style.fontSize = pct + '%';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
