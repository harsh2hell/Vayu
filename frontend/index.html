<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/vayu-icon.png" />
    <link rel="apple-touch-icon" href="/vayu-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
    <title>VAYU — India Cyclone & Weather Intelligence</title>
    <script>
      // Strict Viewport & Zoom Lock (Prevents wheel/pinch/gesture/keyboard zoom)
      (function() {
        function onWheel(e) {
          if (e.ctrlKey || e.metaKey) {
            e.preventDefault();
          }
        }
        window.addEventListener('wheel', onWheel, { passive: false });
        document.addEventListener('wheel', onWheel, { passive: false });

        function onKeyDown(e) {
          if (e.ctrlKey || e.metaKey) {
            if (
              e.key === '+' || e.key === '-' || e.key === '=' || e.key === '_' ||
              e.code === 'NumpadAdd' || e.code === 'NumpadSubtract' ||
              e.code === 'Equal' || e.code === 'Minus'
            ) {
              e.preventDefault();
            }
          }
        }
        window.addEventListener('keydown', onKeyDown, { passive: false });

        function onGesture(e) {
          if (e.target && e.target.closest && e.target.closest('.leaflet-container')) return;
          e.preventDefault();
        }
        document.addEventListener('gesturestart', onGesture, { passive: false });
        document.addEventListener('gesturechange', onGesture, { passive: false });
        document.addEventListener('gestureend', onGesture, { passive: false });

        function onTouchMove(e) {
          if (e.touches && e.touches.length > 1) {
            if (e.target && e.target.closest && e.target.closest('.leaflet-container')) return;
            e.preventDefault();
          }
        }
        document.addEventListener('touchmove', onTouchMove, { passive: false });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Self-healing recovery from stale deployment chunk mismatch
      window.addEventListener('error', function(event) {
        var el = event.target;
        if (el && el.tagName === 'LINK' && el.rel === 'stylesheet') {
          console.warn('[VAYU] Primary stylesheet failed to load, activating fallback...', el.href);
          var fallback = document.getElementById('vayu-fallback-style');
          if (!fallback) {
            var link = document.createElement('link');
            link.id = 'vayu-fallback-style';
            link.rel = 'stylesheet';
            link.href = '/assets/style.css?t=' + Date.now();
            document.head.appendChild(link);
          }
          var reloadKey = 'vayu_css_reload_' + (el.href || '').split('/').pop().split('?')[0];
          if (!sessionStorage.getItem(reloadKey)) {
            sessionStorage.setItem(reloadKey, '1');
            setTimeout(function() { window.location.reload(true); }, 500);
          }
        }
      }, true);
    </script>
    <script>
      (function() {
        try {
          localStorage.removeItem('theme');
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
          var savedFont = localStorage.getItem('vayu_font_offset');
          if (savedFont !== null) {
            var map = { '-3': 75, '-2': 85, '-1': 92, '0': 100, '1': 110, '2': 125, '3': 140, '4': 155 };
            var pct = map[savedFont] || 100;
            document.documentElement.style.fontSize = pct + '%';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body style="margin: 0; background-color: #F8FAFC;">
    <div id="root">
      <div style="min-height: 100vh; width: 100%; background: #F8FAFC; color: #1e293b; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; position: relative; overflow: hidden;">
        <div style="position: absolute; top: 0; left: 0; right: 0; height: 4px; background: linear-gradient(to right, #FF9933, #cbd5e1, #138808); opacity: 0.8;"></div>
        <div style="position: relative; display: flex; align-items: center; justify-content: center;">
          <div style="position: absolute; width: 144px; height: 144px; border-radius: 50%; border: 1px dashed rgba(56,189,248,0.4); animation: vayuSpin 12s linear infinite;"></div>
          <div style="position: relative; width: 88px; height: 88px; display: flex; align-items: center; justify-content: center; animation: vayuSpin 2.4s linear infinite;">
            <img src="/vayu-icon.png" alt="VAYU" style="width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 20px rgba(2,132,199,0.25));" />
          </div>
          <div style="position: absolute; width: 12px; height: 12px; border-radius: 50%; background: #ffffff; border: 2px solid #0284c7; box-shadow: 0 0 10px rgba(14,165,233,0.85);"></div>
        </div>
        <div style="margin-top: 24px; text-align: center; padding: 0 16px;">
          <h1 id="vayu-reload-text" style="font-size: 28px; font-weight: 900; letter-spacing: -0.03em; color: #09090b; margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">Welcome to VAYU</h1>
        </div>
      </div>
      <script>
        (function() {
          try {
            var isHindi = localStorage.getItem('vayu_is_hindi') === 'true';
            var el = document.getElementById('vayu-reload-text');
            if (el && isHindi) {
              el.textContent = 'वायु में आपका स्वागत है';
            }
          } catch (e) {}
        })();
      </script>
      <style>
        @keyframes vayuSpin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
